<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jo Picks | جو بكس</title>
<style>
:root{--pink:#ff4d7a;--light:#fff5f7}
body{margin:0;font-family:system-ui;background:var(--light)}
header{background:white;padding:14px;display:flex;justify-content:space-between;box-shadow:0 2px 15px #ffd6e0;position:sticky;top:0}
.logo{font-weight:900;color:var(--pink);font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border-radius:18px;overflow:hidden}
.card img{width:100%;height:190px;object-fit:cover}
.card-body{padding:10px}
.price{color:var(--pink);font-weight:800}
.btn{background:var(--pink);color:white;display:block;text-align:center;padding:10px;border-radius:20px;text-decoration:none;margin-top:8px}
#adminPanel{display:none;padding:20px;background:white;min-height:100vh}
input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #ffd6e0;box-sizing:border-box}
button{width:100%;padding:13px;background:var(--pink);color:white;border:none;border-radius:25px;font-weight:800;margin-top:8px}
.banner{margin:15px;background:linear-gradient(135deg,#ff8fab,#ff4d7a);color:white;padding:16px;border-radius:16px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">Jo Picks 🌸 جو بكس</div>
  <div style="display:flex;gap:12px"><span onclick="document.getElementById('store').style.display='none';document.getElementById('adminPanel').style.display='block'">⚙️ أدمن</span></div>
</header>

<!-- واجهة المتجر -->
<div id="store">
  <div style="margin:15px;background:white;border-radius:25px;padding:10px 15px;display:flex;gap:8px"><span>🔍</span><input id="search" style="border:none;width:100%" placeholder="ابحثي عن بيجاما..." oninput="render()"></div>
  <div class="banner">كود الخصم الدائم: <b>J4YECUK</b> - شحن لكل الأردن</div>
  <div class="grid" id="products"></div>
</div>

<!-- لوحة الأدمن - كل شي في نفس الملف -->
<div id="adminPanel">
  <h3>لوحة تحكم جو بكس - الأدمن 🌸 <span onclick="location.reload()" style="float:left;cursor:pointer">✕ إغلاق</span></h3>
  <div id="loginBox"><input type="password" id="pass" placeholder="كلمة السر: 1234"><button onclick="if(pass.value=='1234'){loginBox.style.display='none';formBox.style.display='block';showList()}else alert('غلط')">دخول</button></div>
  <div id="formBox" style="display:none">
    <input id="name" placeholder="اسم البيجاما">
    <input id="price" placeholder="السعر: 199">
    <input id="oldPrice" placeholder="السعر القديم (اختياري)">
    <input id="img" placeholder="رابط الصورة - الصقي رابط شي إن أو أي صورة">
    <input id="link" placeholder="رابط الشراء / شي إن">
    <button onclick="add()">+ إضافة منتج</button>
    <div id="list" style="margin-top:20px"></div>
    <button onclick="localStorage.clear();location.reload()" style="background:#333;margin-top:30px">مسح كل المنتجات</button>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('jo_products')||'[]');
function render(){
  let q=(document.getElementById('search')?.value||'').toLowerCase();
  let filtered = products.filter(p=>p.name.toLowerCase().includes(q));
  document.getElementById('products').innerHTML = filtered.map((p,i)=>`
    <div class="card">
      <img src="${p.img}">
      <div class="card-body">
        <div style="font-size:13px">${p.name}</div>
        <div><span class="price">${p.price} د.أ</span> ${p.oldPrice?`<span style="text-decoration:line-through;color:#999;font-size:12px">${p.oldPrice}</span>`:''}</div>
        <a class="btn" href="${p.link||'#'}" target="_blank">اطلبي - J4YECUK</a>
      </div>
    </div>`).join('') || '<div style="grid-column:1/3;text-align:center;padding:40px">المتجر فاضي<br>اضغطي ⚙️ أدمن وضيفي أول بيجامة</div>';
}
function add(){
  if(!name.value||!price.value||!img.value) return alert('عبي الاسم والسعر والصورة');
  products.push({name:name.value,price:price.value,oldPrice:oldPrice.value,img:img.value,link:link.value});
  localStorage.setItem('jo_products',JSON.stringify(products));
  name.value=price.value=oldPrice.value=img.value=link.value=''; render(); showList();
}
function showList(){ list.innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;background:#fff5f7;padding:10px;margin:5px 0;border-radius:10px"><span>${p.name}</span><span onclick="products.splice(${i},1);localStorage.setItem('jo_products',JSON.stringify(products));render();showList()" style="color:red;cursor:pointer">حذف</span></div>`).join('') }
render();
